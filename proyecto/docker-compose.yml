# 02-usuarios: Usuarios sale del monolito.
#
#   cliente ──► nginx:8080 ──┬─► usuarios ──► usuarios-db-1 / -2 / -3   (quórum W=2, R=2)
#                            │      │
#                            │      └─► rabbitmq (sesion_terminada) ──┐
#                            └─► app (monolito) ◄─────────────────────┘
#                                   └─► db (paquetes, movimientos, reintentos)
#
# Redes: cada base solo es alcanzable por el servicio que es su dueño.

x-postgres-usuarios: &postgres-usuarios
  image: postgres:17-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: usuarios
    POSTGRES_USER: ${USUARIOS_DB_USER:-usuarios}
    POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD:-usuarios_desarrollo}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10
  networks: [datos-usuarios]

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app: { condition: service_healthy }
      usuarios: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/nginx"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [borde]

  usuarios:
    build: ./usuarios
    restart: unless-stopped
    environment:
      PORT: 3000
      USUARIOS_DB_URLS: >-
        postgres://${USUARIOS_DB_USER:-usuarios}:${USUARIOS_DB_PASSWORD:-usuarios_desarrollo}@usuarios-db-1:5432/usuarios,
        postgres://${USUARIOS_DB_USER:-usuarios}:${USUARIOS_DB_PASSWORD:-usuarios_desarrollo}@usuarios-db-2:5432/usuarios,
        postgres://${USUARIOS_DB_USER:-usuarios}:${USUARIOS_DB_PASSWORD:-usuarios_desarrollo}@usuarios-db-3:5432/usuarios
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-acme}:${RABBITMQ_PASSWORD:-acme_desarrollo}@rabbitmq:5672
      JWT_PRIVATE_KEY_FILE: /run/claves/usuarios-ed25519.pem
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AcmeDemo2026!}
    volumes:
      - ./claves-desarrollo/usuarios-ed25519.pem:/run/claves/usuarios-ed25519.pem:ro
    depends_on:
      usuarios-db-1: { condition: service_healthy }
      usuarios-db-2: { condition: service_healthy }
      usuarios-db-3: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [borde, datos-usuarios, mensajeria]

  usuarios-db-1:
    <<: *postgres-usuarios
    volumes: [usuarios_datos_1:/var/lib/postgresql/data]
  usuarios-db-2:
    <<: *postgres-usuarios
    volumes: [usuarios_datos_2:/var/lib/postgresql/data]
  usuarios-db-3:
    <<: *postgres-usuarios
    volumes: [usuarios_datos_3:/var/lib/postgresql/data]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: rabbitmq # los datos de RabbitMQ dependen del nombre del nodo
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-acme}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-acme_desarrollo}
    volumes: [rabbitmq_datos:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mensajeria]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-acme}
      POSTGRES_USER: ${DB_USER:-acme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acme_desarrollo}
    volumes:
      - acme_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [datos-monolito]

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-acme}
      DB_USER: ${DB_USER:-acme}
      DB_PASSWORD: ${DB_PASSWORD:-acme_desarrollo}
      USUARIOS_URL: http://usuarios:3000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-acme}:${RABBITMQ_PASSWORD:-acme_desarrollo}@rabbitmq:5672
      JWT_PUBLIC_KEY_FILE: /run/claves/usuarios-ed25519.pub.pem
      # Solo para `npm run demo` dentro del contenedor: entra por Nginx, como un cliente real.
      API_URL: http://nginx
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AcmeDemo2026!}
    volumes:
      - ./claves-desarrollo/usuarios-ed25519.pub.pem:/run/claves/usuarios-ed25519.pub.pem:ro
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [borde, datos-monolito, mensajeria]

networks:
  borde:
  datos-usuarios:
  datos-monolito:
  mensajeria:

volumes:
  acme_datos:
  usuarios_datos_1:
  usuarios_datos_2:
  usuarios_datos_3:
  rabbitmq_datos:
