# Única puerta de entrada (el único contenedor con puerto publicado).
# /api/v1/auth/*  → servicio Usuarios
# /api/v1/*       → monolito (Movimientos, Reintentos, Consulta)
# /interno/*      → no se publica: solo lo usan los servicios entre sí dentro de la red de Docker.

events {}

http {
  # DNS interno de Docker. Con variables en proxy_pass, Nginx vuelve a resolver el nombre
  # cada 10 s: si un contenedor se reinicia con otra IP, el tráfico lo sigue encontrando.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format acme '$remote_addr "$request" $status → $upstream_addr ${upstream_response_time}s';
  access_log /dev/stdout acme;

  proxy_connect_timeout 2s;
  proxy_read_timeout 35s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_intercept_errors off;

  server {
    listen 80;
    set $usuarios http://usuarios:3000;
    set $monolito http://app:8080;

    location /api/v1/auth/ { proxy_pass $usuarios; error_page 502 503 504 = @caido; }
    location /api/v1/      { proxy_pass $monolito; error_page 502 503 504 = @caido; }

    location = /health          { proxy_pass $monolito; error_page 502 503 504 = @caido; }
    location = /health/usuarios { proxy_pass $usuarios/health; error_page 502 503 504 = @caido; }
    location = /health/nginx    { default_type application/json; return 200 '{"estado":"UP"}'; }

    location / { default_type application/json; return 404 '{"statusCode":404,"message":"Ruta no publicada"}'; }

    # Si el servicio de atrás no contesta, el cliente recibe un 503 claro y no una página de Nginx.
    location @caido {
      default_type application/json;
      return 503 '{"statusCode":503,"message":"El servicio no está disponible; intenta de nuevo más tarde"}';
    }
  }
}
